[package]
name = "p2p-libp2p"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated QUIC transport for the Slipstream community inference mesh"

[dependencies]
futures = "0.3"
libp2p = { version = "0.57", default-features = false, features = ["tokio", "quic", "request-response", "macros", "ed25519", "ping"] }
# Streaming behaviour (v0.6 M0 decision, see bench/RESULTS.md "v0.6 M0 transport spike").
# Alpha upstream; 0.5.0-alpha is the release built against libp2p-swarm 0.48 (= libp2p 0.57).
libp2p-stream = "=0.5.0-alpha"
thiserror = { workspace = true }

[dev-dependencies]
p2p-core = { workspace = true }
p2p-crypto = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
