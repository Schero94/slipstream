[package]
name = "p2p-libp2p"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated QUIC transport for the Slipstream community inference mesh"

[dependencies]
async-trait = "0.1"
futures = "0.3"
libp2p = { version = "0.56", default-features = false, features = ["tokio", "quic", "request-response", "macros"] }
thiserror = { workspace = true }

[dev-dependencies]
p2p-core = { workspace = true }
p2p-crypto = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
