[package]
name = "p2p-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "X25519 + ChaCha20-Poly1305 sealed job envelopes for Slipstream P2P (transit encryption, not FHE)"

[dependencies]
p2p-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
x25519-dalek = { version = "2", features = ["static_secrets", "reusable_secrets"] }
chacha20poly1305 = "0.10"
# SealedStream AEAD backend (v0.6 M1 decision; ARMv8 assembly, already in the tree via rustls).
ring = "0.17"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
# v0.6 M2 pairing: SPAKE2 (Ed25519 group) + HMAC key confirmation.
spake2 = "0.4"
hmac = "0.12"

[dev-dependencies]
tempfile = "3"
