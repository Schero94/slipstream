[package]
name = "peregrine-control"
version = "0.3.2"
edition = "2021"
description = "Native control panel for Slipstream — SSD-streaming MoE on Apple Silicon"
default-run = "peregrine-control"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
core-foundation = "0.10"
p2p-core = { path = "../../crates/p2p-core" }
p2p-crypto = { path = "../../crates/p2p-crypto" }
p2p-ledger = { path = "../../crates/p2p-ledger" }
p2p-node = { path = "../../apps/p2p-node" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[[bin]]
name = "peregrine-control"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
