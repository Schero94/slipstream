[package]
name = "peregrine-control"
version = "0.1.1"
edition = "2021"
description = "Native control panel for the Peregrine (llama.cpp fork) SSD-streaming server"
default-run = "peregrine-control"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "peregrine-control"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
