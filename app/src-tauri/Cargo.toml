[package]
name = "peregrine-control"
version = "0.5.3"
edition = "2021"
description = "Native control panel for Slipstream — SSD-streaming MoE on Apple Silicon"
default-run = "peregrine-control"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.23"
core-foundation = "0.10"
p2p-core = { path = "../../crates/p2p-core" }
p2p-crypto = { path = "../../crates/p2p-crypto" }
p2p-ledger = { path = "../../crates/p2p-ledger" }
p2p-node = { path = "../../apps/p2p-node" }
p2p-forward = { path = "../../crates/p2p-forward" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[[bin]]
name = "peregrine-control"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
